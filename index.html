home:()=>`<h1>Ember</h1><h2>Who's feeling bold tonight?</h2>${streak()?`<p class="tag">${streak()}-night streak. Keep it burning.</p>`:''}<button class="btn" onclick="setMode('solo')">Just me<small>Discover what turns you on, in private.</small></button><button class="btn" onclick="setMode('couple')">Me and my partner<small>Answer in secret. See only what you both crave.</small></button><button class="btn" onclick="setMode('group')">A group<small>Only what everyone is comfortable with makes the list.</small></button><button class="btn" onclick="snapNext()">Snap &amp; Show<small>A pic or vid dare game. Private, blurred, deleted after.</small></button><button class="btn" onclick="go('rlh')">Roulettes<small>Roll the dice: edging, anal, bi, selfies and power play.</small></button><button class="btn alt" onclick="go('flags')">🍍 Lifestyle flags<small>Pick the badges that say who you are.</small></button><button class="btn" onclick="go('tasks')">Daily, weekly &amp; monthly tasks<small>Level-based. Tick them off and keep building.</small></button><button class="btn" onclick="go('ins')">My progress<small>Mood, stress and confidence after each session.</small></button><button class="btn alt" onclick="go('learn')">Learn something new<small>Desire, consent and aftercare, in plain words.</small></button>`,
setup:()=>`<h2>${S.mode=='solo'?'Your name':'Who is playing?'}</h2>${S.names.map((n,i)=>`<input id="n${i}" value="${e(n)}" placeholder="Name or nickname ${i+1}" maxlength="20" aria-label="Player ${i+1} name">`).join('')}${S.mode=='group'&&S.names.length<6?`<button class="btn alt" onclick="addP()">Add a player</button>`:''}<p>Pick your level: 0 is shy, 5 is experienced.</p><div class="chips">${[0,1,2,3,4,5].map(h=>`<button class="chip ${S.heat==h?'on':''}" onclick="heat(${h})">${h} · ${HN[h]}</button>`).join('')}</div><button class="btn" onclick="start()">Deal the cards</button><button class="btn alt" onclick="go('home')">Back</button>`,
pass:()=>{const n=e(S.names[S.pi]);return`<p class="mut">Pass the device to</p><div class="big">${n}</div><p>Answer honestly. Your partner never sees a No. Only the Yes and Maybe you share.</p><button class="btn" onclick="go('play')">I'm ${n}. Ready.</button>`},
play:()=>{const c=S.deck[S.ci];return`<div class="bar"><i style="width:${S.ci/S.deck.length*100}%"></i></div><p class="mut">${e(S.names[S.pi])} · card ${S.ci+1} of ${S.deck.length}</p><div class="card"><div class="tag">${e(c.cat)} · ${'L'+c.h}</div><div class="t">${e(c.t)}</div></div><div class="grid"><button class="btn" onclick="answer('y')">🔥 Yes</button><button class="btn alt" onclick="answer('m')">😏 Maybe</button><button class="btn alt" onclick="answer('c')">✨ Curious</button><button class="btn alt" onclick="answer('n')">✋ No</button></div>`},
res:()=>{const m=matches();return`<h2>${S.names.length>1?'Your shared sparks':'What lights you up'}</h2><p class="mut">${m.length?(S.names.length>1?'Everyone said yes, maybe or curious to these. Nothing else is revealed.':'Your private list.'):'No overlap this round. That is okay. Try a lower heat or deal again.'}</p>${m.map(c=>`<div class="row"><b>${c.strong?'EVERYONE SAID YES':'Open to it'} · ${e(c.cat)}</b><br>${e(c.t)}</div>`).join('')}<button class="btn" onclick="chal()">Give me tonight's dare</button><button class="btn" onclick="actStart()">Act them out</button><button class="btn" onclick="nextRound()">Next round: turn it up</button><button class="btn alt" onclick="go('setup')">Deal again</button><button class="btn alt" onclick="go('home')">Home</button>`},
chal:()=>{const c=S.ch;return`<h2>Tonight's dare</h2><div class="card"><div class="tag">${c?e(c.cat)+' · '+'L'+c.h:'Warm-up'}</div><div class="t">${c?e(c.t):'No shared matches yet. Dare: tell each other three things you find irresistible, then deal again.'}</div></div><p class="mut">Optional, always. Skip without a reason, or pause any time.</p><button class="btn" onclick="done()">We did it. Keep the streak</button><button class="btn alt" onclick="chal()">Another dare</button><button class="btn alt" onclick="go('home')">Skip tonight</button>`},
snap:()=>{const p=S.sp,pts=ls('ember_pts')||0;
if(!S.url)return`<h2>Snap &amp; Show</h2><p class="mut">Points: ${pts} 🔥. Snap a pic or vid to score. Skipping is free, no penalty.</p><div class="card"><div class="tag">${'L'+p[0]} Heat ${p[0]}</div><div class="t">${e(p[1])}</div></div><p class="mut">Both of you agree before you start. Media stays on this device, is never uploaded or saved, and stays blurred until revealed. Only ever share your own.</p><label class="btn">📷 Take or choose a pic / video<input type="file" accept="image/*,video/*" onchange="snapFile(this)" hidden></label><button class="btn alt" onclick="snapNext()">Skip. Next dare</button><button class="btn alt" onclick="go('home')">Exit game</button>`;
const st=S.rev?'':'filter:blur(30px)',m=S.vid?`<video src="${S.url}" controls playsinline style="width:100%;border-radius:16px;${st}"></video>`:`<img src="${S.url}" alt="Your snap" style="width:100%;border-radius:16px;${st}">`;
return`<h2>Ready?</h2>${m}<p class="mut">${S.rev?'Revealed. Enjoy it, then delete.':'Hidden until the viewer taps reveal.'}</p>${S.rev?'':'<button class="btn" onclick="snapRev()">Reveal to partner</button>'}<button class="btn ${S.rev?'':'alt'}" onclick="snapDone()">Delete it and score a point</button>`},
act:()=>{if(!S.am.length)return`<h2>Nothing to act out yet</h2><p class="mut">No shared yes cards this round. Raise the level and deal again.</p><button class="btn" onclick="go('setup')">Back to setup</button>`;
const c=S.am[S.ai],n=`${S.ai+1} of ${S.am.length}`;
if(!S.as)return`<p class="mut">Act ${n} · ${e(c.cat)} · L${c.h}</p><div class="card"><div class="t">${e(c.t)}</div></div><p class="mut">Act it out now, alone or together. Go slowly, breathe, and stop any time. Then come back.</p><button class="btn" onclick="actNext()">I did it. Capture it</button><button class="btn alt" onclick="S.ai++;S.ai>=S.am.length?go('ins'):render()">Skip this one</button>`;
return`<h2>Capture it</h2><label class="btn alt">📷 Add a cover photo, optional<input type="file" accept="image/*" onchange="actPhoto(this)" hidden></label>${S.ph?`<img src="${S.ph}" alt="Your cover photo" style="width:100%;max-height:240px;object-fit:cover;border-radius:14px">`:''}<p class="mut">For your eyes only. Never uploaded, gone when you continue.</p><p>Describe it in detail: what you did, what you felt, what you want next.</p><textarea id="fd" rows="5" placeholder="Be vivid..." aria-label="Describe it"></textarea><p>Mood now <input id="fm" type="range" min="1" max="5" value="3"></p><p>Stress now <input id="fs" type="range" min="1" max="5" value="3"></p><p>Confidence now <input id="fc" type="range" min="1" max="5" value="3"></p><button class="btn" onclick="actNext()">Save to my private log</button>`},
ins:()=>{let L=[];try{L=JSON.parse(ls('ember_log')||'[]')}catch(x){}
if(!L.length)return`<h2>My progress</h2><p class="mut">No sessions logged yet. Act out a card and save how you feel to track mood, stress and confidence.</p><button class="btn alt" onclick="go('home')">Back</button>`;
const av=(a,k)=>a.length?a.reduce((x,y)=>x+y[k],0)/a.length:0,f=x=>x.toFixed(1),R=L.slice(-5),P=L.slice(0,-5),d=k=>P.length?av(R,k)-av(P,k):0,sg=x=>(x>0?'+':'')+f(x),r=(t,k)=>`<div class="row"><b>${t}</b><br>${f(av(L,k))} of 5 average${P.length?' · '+sg(d(k))+' recently':''}</div>`;
return`<h2>My progress</h2><p class="mut">Self-reported, not medical advice. ${L.length} sessions logged.</p>${r('MOOD','m')}${r('STRESS (lower is better)','s')}${r('CONFIDENCE','c')}<h2>Private journal</h2>${L.slice(-3).reverse().map(x=>`<div class="row">${e(x.d||'(no notes)')}</div>`).join('')}<button class="btn alt" onclick="ls('ember_log','[]');render()">Clear my log</button><button class="btn alt" onclick="go('home')">Back</button>`},
tasks:()=>{const d=new Date(),st={Daily:d.toDateString(),Weekly:Math.floor(Date.now()/6048e5),Monthly:d.getFullYear()+'-'+d.getMonth()},a=ckl();
return`<h2>Tasks</h2><p class="mut">Level ${S.heat}. Daily resets each day, weekly each week, monthly each month. All optional.</p><div class="chips">${[0,1,2,3,4,5].map(h=>`<button class="chip ${S.heat==h?'on':''}" onclick="S.heat=${h};render()">${h}</button>`).join('')}</div>`+['Daily','Weekly','Monthly'].map(p=>`<h2>${p}</h2>`+TK.map((t,i)=>t[0]==p&&t[1]<=S.heat?(k=>`<button class="btn alt" onclick="tk('${k}')">${a.includes(k)?'✅':'⬜'} ${e(t[2])}</button>`)('k'+p+st[p]+i):'').join('')).join('')+`<button class="btn alt" onclick="go('home')">Back</button>`},
rlh:()=>`<h2>Roulettes</h2><p class="mut">Each roll picks from your level (${S.heat}) and below. Roll again any time, pass on anything.</p>${R.map((q,i)=>`<button class="btn" onclick="rl(${i})">${e(q.k)}</button>`).join('')}<button class="btn alt" onclick="go('home')">Back</button>`,
rlt:()=>{const q=R[S.ri];return`<h2>${e(q.k)}</h2><p class="mut">${e(q.r)}</p>${S.roll?S.roll.map((x,i)=>`<div class="row"><b>${'WXYZ'[i]} · ${e(x[0])} · rolled ${x[1]}</b><br>${e(x[2])}</div>`).join('')+`<p class="mut">Bonus dice: ${S.bd}</p>`+(S.bo?`<div class="row"><b>BONUS</b><br>${e(S.bo)}</div>`:'')+(S.spin?'':`<button class="btn" onclick="rDone()">Done. Score a point</button>`):''}<button class="btn ${S.roll?'alt':''}" onclick="doRoll()">${S.roll?'Roll again':'Roll the dice'}</button><button class="btn alt" onclick="go('rlh')">Back</button>`},
flags:()=>{const a=flg();return`<h2>🍍 Lifestyle flags</h2><p class="mut">Private badges, saved on this device.</p><div class="chips">${FL.map((t,i)=>`<button class="chip ${a.includes(i)?'on':''}" onclick="fl(${i})">${e(t)}</button>`).join('')}</div><button class="btn alt" onclick="go('home')">Back</button>`},
learn:()=>`<h2>Learn something new</h2>${TIPS.map(t=>`<div class="row"><b>${e(t[0])}</b><br>${e(t[1])}</div>`).join('')}<button class="btn alt" onclick="go('home')">Back</button>`
};
function render(){const a=$('#app');a.innerHTML=V[S.scr]();if(S._l!==S.scr){a.classList.remove('in');void a.offsetWidth;a.classList.add('in');S._l=S.scr}}
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(x){}};
function th(){const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches,n=d?'light':'dark';r.dataset.theme=n;ls('ember_th',n)}
if(ls('ember_th'))document.documentElement.dataset.theme=ls('ember_th');
document.addEventListener('click',ev=>{if(ev.target.closest('.btn,.chip'))vib(10)});
(function(){const c=$('#fx'),x=c.getContext('2d'),rm=matchMedia('(prefers-reduced-motion:reduce)').matches;let W,H,P=[];
function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();addEventListener('resize',rs);
function add(px,py,b){P.push({x:px,y:py,vx:(Math.random()-.5)*(b?9:.5),vy:b?-Math.random()*10:-Math.random()*.7-.2,r:Math.random()*2.5+1,l:b?70:400+Math.random()*300,b:b})}
window.burst=function(){if(rm)return;for(let i=0;i<60;i++)add(W/2,H*.6,1)};
if(rm)return;
(function t(){x.clearRect(0,0,W,H);const col=getComputedStyle(document.documentElement).getPropertyValue('--ac').trim()||'#ff5e7e';
if(P.length<45&&Math.random()<.3)add(Math.random()*W,H+5,0);
P=P.filter(p=>p.l>0&&p.y>-20);
for(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.b)p.vy+=.25;p.l--;x.globalAlpha=Math.min(1,p.l/50)*(p.b?.9:.45);x.fillStyle=col;x.beginPath();x.arc(p.x,p.y,p.r,0,6.3);x.fill()}
requestAnimationFrame(t)})()})();
['rDone','done','snapDone'].forEach(n=>{const f=window[n];window[n]=function(){burst();vib([20,30,20]);return f.apply(this,arguments)}});
(function(){const dr=window.doRoll;window.doRoll=function(){if(S.spin)return;S.spin=1;let n=0;const t=setInterval(()=>{S.roll=R[S.ri].d.map(d=>[d[0],Math.floor(Math.random()*10),'Rolling...']);S.bd='????';S.bo=null;render();vib(8);if(++n>7){clearInterval(t);S.spin=0;dr();vib(30);if(S.bo)burst()}},70)}})();
go(ls('ember_age')=='1'?'home':'gate');
</script></body></html>
